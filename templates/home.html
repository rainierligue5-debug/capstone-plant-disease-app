<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Based Corn Leaf Disease Detection</title>
    <link rel="icon" href="{{ url_for('static', filename='images/logo.svg') }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='chatbot/chatbot.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary" data-bs-theme="dark">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">
            <img src="{{ url_for('static', filename='images/logo.svg') }}" alt="" width="30" height="24" class="d-inline-block align-text-top">
            PHASAL
          </a>
        </div>
    </nav>

    <div class="carousel-inner">
        <div class="carousel-item active">
            <div class="carousel-text-wrapper">
                <h1 class="carousel-text-title">Corn Disease Recognition</h1>
                <div class="form-box">
                  <form action="/upload/" method="POST" enctype="multipart/form-data">
                    <h1>Upload Image</h1>
                    <div class="input-box d-flex">
                      <input type="file" accept="image/png, image/jpeg" name="img" required>
                    </div>
                    <div class="input-box d-flex">
                      <button type="submit" class="btn btn-success m-auto">Upload</button>
                    </div>
                  </form>

                  {% if result %}
                  <div class="result-container">
                    <div class="result-box">
                      <div class="result-img-container">
                        <img src="{{ imagepath }}" alt="uploaded image" class="result-image">
                      </div>
                      <div class="result-text">
                        <h3>{{ prediction['name'] }}</h3>
                        <p><strong>Cause:</strong> {{ prediction['cause'] }}</p>
                        <p><strong>Cure:</strong> {{ prediction['cure'] }}</p>
                        <p><strong>Confidence:</strong> {{ prediction['confidence'] }}</p>
                      </div>
                    </div>
                  </div>
                  {% endif %}
                </div>
            </div>
        </div>
    </div>

    <!-- CHATBOT -->
    {% include 'chatbot.html' %}

    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
    <script src="{{ url_for('static', filename='chatbot/chatbot.js') }}"></script>
</body>
</html>
